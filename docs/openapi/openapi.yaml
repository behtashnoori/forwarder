  /api/admin/master-data/{resource}:
    parameters:
      - name: resource
        in: path
        required: true
        schema: { type: string, enum: [cargo-types, service-types, units-of-measure] }
    get:
      tags: [Master Data]
      summary: List governed master data
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - { name: q, in: query, schema: { type: string } }
        - { name: active, in: query, schema: { type: string, enum: [all, 'true', 'false'] } }
        - { name: sort, in: query, schema: { type: string, enum: [display_order, code, fa_name, en_name, updated_at] } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: measurement_dimension, in: query, schema: { type: string, enum: [COUNT, WEIGHT, VOLUME, LENGTH, OTHER_GOVERNED] } }
      responses:
        '200':
          description: Paginated canonical values.
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/MasterDataItem' } }, page: { type: integer }, per_page: { type: integer }, total: { type: integer }, pages: { type: integer } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Master Data]
      summary: Create governed master data
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MasterDataCreate' } } } }
      responses:
        '201': { description: Created canonical value. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Duplicate or conflicting canonical value. }
  /api/admin/master-data/{resource}/{public_id}:
    parameters:
      - { name: resource, in: path, required: true, schema: { type: string, enum: [cargo-types, service-types, units-of-measure] } }
      - { name: public_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Master Data]
      summary: Get governed master-data detail
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Canonical value detail. }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Master Data]
      summary: Update mutable fields using optimistic version
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MasterDataUpdateRequest' } } } }
      responses:
        '200': { description: Updated canonical value. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Optimistic version conflict. }
  /api/admin/master-data/{resource}/{public_id}/{action}:
    post:
      tags: [Master Data]
      summary: Activate or deactivate a canonical value
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: resource, in: path, required: true, schema: { type: string, enum: [cargo-types, service-types, units-of-measure] } }
        - { name: public_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [activate, deactivate] } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [version], properties: { version: { type: integer, minimum: 1 } } } } }
      responses:
        '200': { description: Activation state changed. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Optimistic version conflict. }
