                    additionalProperties: true
                    properties:
                      new:
                        type: integer
                      in_progress:
                        type: integer
                      waiting_for_customer:
                        type: integer
                      closed_today:
                        type: integer
                  sla:
                    type: object
                    additionalProperties: true
                    properties:
                      overdue:
                        type: integer
                      due_soon:
                        type: integer
              examples:
                default:
                  value:
