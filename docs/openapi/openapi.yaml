openapi: 3.0.3
info:
  title: Forwarder Backend API
  version: 0.1.0
  description: |
    Initial OpenAPI documentation for the Forwarder backend.

    This document is based on current Flask routes, service-layer behavior, and characterization tests.
    It intentionally reflects current behavior, including imperfect or legacy response shapes.
servers:
  - url: http://localhost:5000
    description: Local backend placeholder
tags:
  - name: Public Shipment
  - name: Public Tracking
  - name: Expert Auth
  - name: Expert Console
  - name: CRM
  - name: User Management
  - name: Admin Panel
  - name: Customer Gamification
  - name: Site Settings
components:
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        default: 20
    RequestId:
      name: request_id
      in: path
      required: true
      schema:
        type: integer
  responses:
    Message:
      description: Message payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    BadRequest:
      description: Bad request using current route-specific localized payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated user lacks required role or request access.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found using current route-specific localized payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Internal server error using current route-specific localized payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token used by protected expert, CRM, admin, and user-management endpoints.
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: true
      properties:
        error:
          type: string
        message:
          type: string
      description: Current API uses both `error` and `message` depending on route.
    MessageResponse:
      type: object
      additionalProperties: true
      properties:
        message:
          type: string
    IdName:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
        name:
          type: string
    TransportMethodsPayload:
      type: object
      additionalProperties: true
      properties:
        domestic_methods:
          type: array
          items:
            $ref: '#/components/schemas/IdName'
        international_methods:
          type: array
          items:
            $ref: '#/components/schemas/IdName'
    ShipmentRequestCreate:
      type: object
      additionalProperties: true
      description: Best-effort public shipment form payload. Exact optional fields depend on shipment type.
      properties:
        shipping_type:
          type: string
          example: domestic
        customer_name:
          type: string
        customer_phone:
          type: string
        customer_email:
          type: string
        transport_method:
          type: string
        cargo_type:
          type: string
    ShipmentRequestCreated:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
        tracking_code:
          type: string
        status:
          type: string
        message:
          type: string
    Pagination:
      type: object
      additionalProperties: true
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        pages:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    ExpertLoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    ExpertLoginResponse:
      type: object
      additionalProperties: true
      properties:
        success:
          type: boolean
        expert:
          type: object
          additionalProperties: true
        tokens:
          type: object
          additionalProperties: true
    QuoteRequest:
      type: object
      additionalProperties: true
      properties:
        amount:
          type: number
        currency:
          type: string
          example: IRR
        note:
          type: string
        valid_until:
          type: string
          format: date
    MessageRequest:
      type: object
      additionalProperties: true
      properties:
        message:
          type: string
    AssignmentRequest:
      type: object
      additionalProperties: true
      properties:
        expert_id:
          type: integer
    ExpertStatusUpdateRequest:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
          description: Requested shipment request status.
          enum:
            - new
            - assigned
            - in_progress
            - quoted
            - waiting_for_customer
            - won
            - lost
            - closed
        note:
          type: string
          description: Optional status-change note sent by the frontend.
    UserPayload:
      type: object
      additionalProperties: true
      properties:
        username:
          type: string
        email:
          type: string
        full_name:
          type: string
        role:
          type: string
        password:
          type: string
        phone:
          type: string
        department:
          type: string
    AssignmentRulePayload:
      type: object
      additionalProperties: true
      properties:
        name:
          type: string
        priority:
          type: integer
        conditions:
          type: object
          additionalProperties: true
        assignment_strategy:
          type: string
        is_active:
          type: boolean
    ReferralRulePayload:
      type: object
      additionalProperties: true
      properties:
        name:
          type: string
        priority:
          type: integer
        conditions:
          type: object
          additionalProperties: true
        is_active:
          type: boolean
    CustomerRegistrationRequest:
      type: object
      required:
        - email
        - phone
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
          example: '09120000000'
        first_name:
          type: string
        last_name:
          type: string
    CustomerRegistrationResponse:
      type: object
      additionalProperties: true
      properties:
        message:
          type: string
        customer_id:
          type: integer
        email_sent:
          type: boolean
        is_verified:
          type: boolean
    CompleteStepRequest:
      type: object
      required:
        - customer_id
        - request_id
        - step_name
      properties:
        customer_id:
          type: integer
        request_id:
          type: integer
        step_name:
          type: string
          example: expert_assigned
    SiteSettings:
      type: object
      additionalProperties: true
paths:
  /api/transport-methods:
    get:
      tags: [Public Shipment]
      summary: List public transport methods
      description: Public endpoint. Returns available domestic and international transport methods.
      responses:
        '200':
          description: Transport methods payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportMethodsPayload'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/shipment-request:
    post:
      tags: [Public Shipment]
      summary: Create a public shipment request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentRequestCreate'
      responses:
        '201':
          description: Shipment request created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentRequestCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/public/track/{identifier}:
    get:
      tags: [Public Tracking]
      summary: Public shipment tracking by id or tracking code
      parameters:
        - name: identifier
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Public tracking payload. Best-effort schema from public tracking contract tests.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/expert/auth/login:
    post:
      tags: [Expert Auth]
      summary: Expert/admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpertLoginRequest'
      responses:
        '200':
          description: Login success with expert data and tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpertLoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    options:
      tags: [Expert Auth]
      summary: CORS preflight for login
      responses:
        '200':
          description: Empty CORS preflight response.
  /api/expert/auth/refresh:
    post:
      tags: [Expert Auth]
      summary: Refresh expert access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Refreshed token payload.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/expert/auth/logout:
    post:
      tags: [Expert Auth]
      summary: Logout authenticated expert
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/expert/requests:
    get:
      tags: [Expert Console]
      summary: List expert console shipment requests
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated request list.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/expert/requests/{request_id}:
    get:
      tags: [Expert Console]
      summary: Get expert shipment request detail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Request detail payload.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/expert/requests/{request_id}/assign:
    post:
      tags: [Expert Console]
      summary: Assign or reassign a request to an expert
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentRequest'
      responses:
        '200':
          description: Assignment response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/expert/requests/{request_id}/status:
    post:
      tags: [Expert Console]
      summary: Update expert shipment request status
      description: |
        Mutation endpoint used by the centralized `changeRequestStatus` frontend helper.
        Current behavior updates the request status, marks it unread for the assignee,
        writes an ExpertConsoleLog status_change entry, and creates a status-change
        notification when the request has an assignee.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpertStatusUpdateRequest'
            examples:
              default:
                value:
                  status: in_progress
                  note: Started
      responses:
        '200':
          description: Status update response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  message:
                    type: string
                  status:
                    type: string
              examples:
                default:
                  value:
                    message: Status updated successfully
                    status: in_progress
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/expert/requests/{request_id}/quote:
    post:
      tags: [Expert Console]
      summary: Create quote for a request
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
      responses:
        '200':
          description: Quote creation response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/expert/requests/{request_id}/quote/latest:
    get:
      tags: [Expert Console]
      summary: Get latest quote for a request
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Latest quote payload; current behavior may return null quote fields.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/expert/requests/{request_id}/messages:
    post:
      tags: [Expert Console]
      summary: Add message to a request
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
      responses:
        '200':
          description: Message creation response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/expert/notifications:
    get:
      tags: [Expert Console]
      summary: List notifications for current expert
      security:
        - bearerAuth: []
      parameters:
        - name: unread_only
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Notification list payload.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/expert/notifications/mark-read:
    post:
      tags: [Expert Console]
      summary: Mark notifications as read
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                notification_ids:
                  type: array
                  items:
                    type: integer
                mark_all:
                  type: boolean
      responses:
        '200':
          description: Mark-read response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/expert/requests/{request_id}/mark-read:
    post:
      tags: [Expert Console]
      summary: Mark expert shipment request as read
      description: |
        Marks a shipment request as read for the authenticated expert context.
        The existing frontend helper is `markRequestAsRead`, which sends
        `expert_id` as a query parameter, although the backend currently uses
        authenticated request access checks rather than a request body.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: expert_id
          in: query
          required: false
          schema:
            type: integer
          description: Existing centralized frontend helper sends this query parameter.
      responses:
        '200':
          description: Request marked as read.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  message:
                    type: string
              examples:
                default:
                  value:
                    message: Request marked as read
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/expert/dashboard/kpis:
    get:
      tags: [Expert Console]
      summary: Get expert dashboard KPI counters
      description: |
        Read-only Expert Console KPI payload used by the current frontend `fetchKPIs` helper.
        The response shape is documented from the current TypeScript client contract.
      security:
        - bearerAuth: []
      parameters:
        - name: expert_id
          in: query
          required: false
          schema:
            type: integer
          description: Optional expert id currently passed by the frontend when loading KPI counters.
      responses:
        '200':
          description: Expert dashboard KPI counters.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  counts:
                    type: object
                    additionalProperties: true
                    properties:
                      new:
                        type: integer
                      in_progress:
                        type: integer
                      waiting_for_customer:
                        type: integer
                      closed_today:
                        type: integer
                  sla:
                    type: object
                    additionalProperties: true
                    properties:
                      overdue:
                        type: integer
                      due_soon:
                        type: integer
              examples:
                default:
                  value:
                    counts:
                      new: 3
                      in_progress: 5
                      waiting_for_customer: 2
                      closed_today: 1
                    sla:
                      overdue: 1
                      due_soon: 2
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/expert/experts:
    get:
      tags: [Expert Console]
      summary: List available expert users
      description: |
        Read-only Expert Console expert list payload used by the current frontend `fetchExperts` helper.
        The documented response shape is based on the current TypeScript client contract.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Expert list payload.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  experts:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        id:
                          type: integer
                        username:
                          type: string
                        full_name:
                          type: string
                        role:
                          type: string
              examples:
                default:
                  value:
                    experts:
                      - id: 1
                        username: expert1
                        full_name: Example Expert
                        role: business_expert
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/crm/customers:
    get:
      tags: [CRM]
      summary: List CRM customers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: search
          in: query
          schema:
            type: string
        - name: customer_type
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: CRM customer list.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [CRM]
      summary: Create CRM customer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Customer created.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/crm/customers/{customer_id}:
    get:
      tags: [CRM]
      summary: Get CRM customer detail
      security:
        - bearerAuth: []
      parameters:
        - name: customer_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Customer detail payload.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags: [CRM]
      summary: Update CRM customer
      security:
        - bearerAuth: []
      parameters:
        - name: customer_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/crm/opportunities:
    get:
      tags: [CRM]
      summary: List CRM opportunities
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: stage
          in: query
          schema:
            type: string
        - name: assigned_to
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Opportunity list payload.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [CRM]
      summary: Create CRM opportunity
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Opportunity created.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '500':
          $ref: '#/components/responses/ServerError'
  /api/crm/activities:
    get:
      tags: [CRM]
      summary: List CRM activities
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: activity_type
