openapi: 3.0.3
info:
  title: Forwarder Backend API
  version: 1.6.0
  description: |
    Initial OpenAPI documentation for the Forwarder backend.

    This document is based on current Flask routes, service-layer behavior, and characterization tests.
    It intentionally reflects current behavior, including imperfect or legacy response shapes.
servers:
  - url: http://localhost:5000
    description: Local backend placeholder
tags:
  - name: Internal Cargo
  - name: Master Data
  - name: Execution Units
  - name: Public Project Tracking
  - name: Public Shipment
  - name: Public Tracking
  - name: Expert Auth
  - name: Expert Console
  - name: CRM
  - name: User Management
  - name: Admin Panel
  - name: Customer Gamification
  - name: Site Settings
components:
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        default: 20
    RequestId:
      name: request_id
      in: path
      required: true
      schema:
        type: integer
  responses:
    Message:
      description: Message payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    BadRequest:
      description: Bad request using current route-specific localized payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated user lacks required role or request access.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found using current route-specific localized payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Internal server error using current route-specific localized payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token used by protected expert, CRM, admin, and user-management endpoints.
  schemas:
    MasterDataItem:
      type: object
      required: [public_id, immutable_code, fa_name, en_name, display_order, is_active, created_at, updated_at, version]
      properties:
        public_id: { type: string, format: uuid }
        immutable_code: { type: string, maxLength: 64 }
        fa_name: { type: string, maxLength: 160 }
        en_name: { type: string, maxLength: 160 }
        description: { type: string, nullable: true }
        parent_id: { type: string, format: uuid, nullable: true }
        symbol: { type: string, maxLength: 32 }
        measurement_dimension:
          type: string
          enum: [COUNT, WEIGHT, VOLUME, LENGTH, OTHER_GOVERNED]
        display_order: { type: integer }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    MasterDataWrite:
      type: object
      required: [immutable_code, fa_name, en_name]
      properties:
        immutable_code: { type: string, maxLength: 64 }
        fa_name: { type: string, maxLength: 160 }
        en_name: { type: string, maxLength: 160 }
        description: { type: string, nullable: true }
        display_order: { type: integer, default: 0 }
        is_active: { type: boolean, default: true }
    CargoTypeCreate:
      allOf:
        - { $ref: '#/components/schemas/MasterDataWrite' }
        - type: object
          properties:
            parent_id: { type: string, format: uuid, nullable: true }
    ServiceTypeCreate:
      allOf:
        - { $ref: '#/components/schemas/MasterDataWrite' }
    UnitOfMeasureCreate:
      allOf:
        - { $ref: '#/components/schemas/MasterDataWrite' }
        - type: object
          required: [symbol, measurement_dimension]
          properties:
            symbol: { type: string, maxLength: 32 }
            measurement_dimension: { type: string, enum: [COUNT, WEIGHT, VOLUME, LENGTH, OTHER_GOVERNED] }
    MasterDataCreate:
      oneOf:
        - { $ref: '#/components/schemas/CargoTypeCreate' }
        - { $ref: '#/components/schemas/ServiceTypeCreate' }
        - { $ref: '#/components/schemas/UnitOfMeasureCreate' }
    MasterDataUpdate:
      type: object
      required: [version]
      properties:
        immutable_code: { type: string, description: May be repeated unchanged; changes are rejected. }
        fa_name: { type: string, maxLength: 160 }
        en_name: { type: string, maxLength: 160 }
        description: { type: string, nullable: true }
        display_order: { type: integer }
        version: { type: integer, minimum: 1 }
    CargoTypeUpdate:
      allOf:
        - { $ref: '#/components/schemas/MasterDataUpdate' }
        - type: object
          properties:
            parent_id: { type: string, format: uuid, nullable: true }
    ServiceTypeUpdate:
      allOf:
        - { $ref: '#/components/schemas/MasterDataUpdate' }
    UnitOfMeasureUpdate:
      allOf:
        - { $ref: '#/components/schemas/MasterDataUpdate' }
        - type: object
          properties:
            symbol: { type: string, maxLength: 32 }
            measurement_dimension: { type: string, enum: [COUNT, WEIGHT, VOLUME, LENGTH, OTHER_GOVERNED] }
    MasterDataUpdateRequest:
      oneOf:
        - { $ref: '#/components/schemas/CargoTypeUpdate' }
        - { $ref: '#/components/schemas/ServiceTypeUpdate' }
        - { $ref: '#/components/schemas/UnitOfMeasureUpdate' }
    ErrorResponse:
      type: object
      additionalProperties: true
      properties:
        error:
          type: string
        message:
          type: string
      description: Current API uses both `error` and `message` depending on route.
    MessageResponse:
      type: object
      additionalProperties: true
      properties:
        message:
          type: string
    IdName:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
        name:
          type: string
    TransportMethodsPayload:
      type: object
      additionalProperties: true
      properties:
        domestic_methods:
          type: array
          items:
            $ref: '#/components/schemas/IdName'
        international_methods:
          type: array
          items:
            $ref: '#/components/schemas/IdName'
    ShipmentRequestCreate:
      type: object
      additionalProperties: true
      description: Best-effort public shipment form payload. Exact optional fields depend on shipment type.
      properties:
        shipping_type:
          type: string
          example: domestic
        customer_name:
          type: string
        customer_phone:
          type: string
        customer_email:
          type: string
        transport_method:
          type: string
        cargo_type:
          type: string
    ShipmentRequestCreated:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
        tracking_code:
          type: string
        status:
          type: string
        message:
          type: string
    Pagination:
      type: object
      additionalProperties: true
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        pages:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    ExpertLoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    ExpertLoginResponse:
      type: object
      additionalProperties: true
      properties:
        success:
          type: boolean
        expert:
          type: object
          additionalProperties: true
        tokens:
          type: object
          additionalProperties: true
    QuoteRequest:
      type: object
      additionalProperties: true
      properties:
        amount:
          type: number
        currency:
          type: string
          example: IRR
        note:
          type: string
        valid_until:
          type: string
          format: date
    MessageRequest:
      type: object
      additionalProperties: true
      properties:
        message:
          type: string
    AssignmentRequest:
      type: object
      additionalProperties: true
      properties:
        expert_id:
          type: integer
    ExpertStatusUpdateRequest:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
          description: Requested shipment request status.
          enum:
            - new
            - assigned
            - in_progress
            - quoted
            - waiting_for_customer
            - won
            - lost
            - closed
        note:
          type: string
          description: Optional status-change note sent by the frontend.
    UserPayload:
      type: object
      additionalProperties: true
      properties:
        username:
          type: string
        email:
          type: string
        full_name:
          type: string
        role:
          type: string
        password:
          type: string
        phone:
          type: string
        department:
          type: string
    AssignmentRulePayload:
      type: object
      additionalProperties: true
      properties:
        name:
          type: string
        priority:
          type: integer
        conditions:
          type: object
          additionalProperties: true
        assignment_strategy:
          type: string
        is_active:
          type: boolean
    ReferralRulePayload:
      type: object
      additionalProperties: true
      properties:
        name:
          type: string
        priority:
          type: integer
        conditions:
          type: object
          additionalProperties: true
        is_active:
          type: boolean
    CustomerRegistrationRequest:
      type: object
      required:
        - email
        - phone
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
          example: '09120000000'
        first_name:
          type: string
        last_name:
          type: string
    CustomerRegistrationResponse:
      type: object
      additionalProperties: true
      properties:
        message:
          type: string
        customer_id:
          type: integer
        email_sent:
          type: boolean
        is_verified:
          type: boolean
    CompleteStepRequest:
      type: object
      required:
        - customer_id
        - request_id
        - step_name
      properties:
        customer_id:
          type: integer
        request_id:
          type: integer
        step_name:
          type: string
          example: expert_assigned
    SiteSettings:
      type: object
      additionalProperties: true
    CargoAlias:
      type: object
      required: [public_id, alias_text, normalized_alias, language, alias_type, is_active]
      properties:
        public_id: { type: string, format: uuid }
        alias_text: { type: string, maxLength: 200 }
        normalized_alias: { type: string, maxLength: 200 }
        language: { type: string, enum: [fa, en, und] }
        alias_type: { type: string, enum: [COMMON_NAME, CUSTOMER_TERM, ABBREVIATION, LEGACY_TERM, OTHER_GOVERNED] }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CargoCatalogItem:
      type: object
      required: [public_id, immutable_code, fa_name, cargo_type, is_active, version]
      properties:
        public_id: { type: string, format: uuid }
        immutable_code: { type: string, maxLength: 64 }
        fa_name: { type: string, maxLength: 160 }
        en_name: { type: string, nullable: true, maxLength: 160 }
        description: { type: string, nullable: true }
        part_number: { type: string, nullable: true }
        customer_item_code: { type: string, nullable: true }
        hs_code: { type: string, nullable: true }
        brand: { type: string, nullable: true }
        model: { type: string, nullable: true }
        cargo_type: { type: object, additionalProperties: true }
        default_uom: { type: object, nullable: true, additionalProperties: true }
        aliases: { type: array, items: { $ref: '#/components/schemas/CargoAlias' } }
        is_active: { type: boolean }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ShipmentCargoItem:
      type: object
      required: [public_id, line_number, source, cargo_type_public_id, uom_public_id, quantity, display_name_snapshot, cargo_type_code_snapshot, uom_code_snapshot, uom_symbol_snapshot, version]
      properties:
        public_id: { type: string, format: uuid }
        line_number: { type: integer, minimum: 1 }
        source: { type: string, enum: [catalog, manual] }
        catalog_item_public_id: { type: string, format: uuid, nullable: true }
        cargo_type_public_id: { type: string, format: uuid }
        uom_public_id: { type: string, format: uuid }
        quantity: { type: string, pattern: '^[0-9]+(?:\.[0-9]+)?$' }
        display_name_snapshot: { type: string }
        cargo_type_code_snapshot: { type: string }
        cargo_type_fa_snapshot: { type: string }
        cargo_type_en_snapshot: { type: string }
        uom_code_snapshot: { type: string }
        uom_symbol_snapshot: { type: string }
        part_number_snapshot: { type: string, nullable: true }
        customer_item_code_snapshot: { type: string, nullable: true }
        hs_code_snapshot: { type: string, nullable: true }
        brand_snapshot: { type: string, nullable: true }
        model_snapshot: { type: string, nullable: true }
        description_snapshot: { type: string, nullable: true }
        version: { type: integer, minimum: 1 }
paths:
  /api/v2/projects/{projectId}/execution-units:
    get:
      tags: [Execution Units]
      summary: List Project execution units without timelines
      security: [{bearerAuth: []}]
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
        - {name: search, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
        - {name: delayed, in: query, schema: {type: boolean}}
        - {name: stale, in: query, schema: {type: boolean}}
        - {name: active, in: query, schema: {type: boolean}}
      responses: {'200': {description: Bounded unit page}, '404': {$ref: '#/components/responses/NotFound'}}
    post:
      tags: [Execution Units]
      summary: Create an ExecutionUnit with a generated immutable Project-local code
      security: [{bearerAuth: []}]
      parameters: [{name: projectId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'201': {description: Unit created}, '404': {$ref: '#/components/responses/NotFound'}}
  /api/v2/projects/{projectId}/execution-units/{unitId}:
    get:
      tags: [Execution Units]
      summary: Get scoped unit detail
      security: [{bearerAuth: []}]
      parameters: &unitPath
        - {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: unitId, in: path, required: true, schema: {type: string, format: uuid}}
      responses: {'200': {description: Unit detail}, '404': {$ref: '#/components/responses/NotFound'}}
    patch:
      tags: [Execution Units]
      summary: Update permitted metadata using expected_version
      security: [{bearerAuth: []}]
      parameters: *unitPath
      responses: {'200': {description: Unit updated}, '409': {description: Version conflict}}
  /api/v2/projects/{projectId}/execution-units/{unitId}/timeline:
    get:
      tags: [Execution Units]
      summary: Get paginated internal unit timeline
      security: [{bearerAuth: []}]
      parameters: *unitPath
      responses: {'200': {description: Bounded timeline page}}
  /api/v2/projects/{projectId}/execution-units/{unitId}/events:
    post:
      tags: [Execution Units]
      summary: Append an idempotent unit event/update
      security: [{bearerAuth: []}]
      parameters: *unitPath
      responses: {'201': {description: Event appended}, '409': {description: Version or idempotency conflict}}
  /api/public/v2/projects/{trackingCode}/summary:
    get:
      tags: [Public Project Tracking]
      summary: Get aggregate project summary by opaque tracking code
      parameters: [{name: trackingCode, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Customer-safe aggregate summary}, '404': {$ref: '#/components/responses/NotFound'}}
  /api/public/v2/projects/{trackingCode}/execution-units:
    get:
      tags: [Public Project Tracking]
      summary: List customer-visible unit projections
      parameters: [{name: trackingCode, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Bounded customer-safe unit page}}
  /api/public/v2/projects/{trackingCode}/execution-units/{unitId}:
    get:
      tags: [Public Project Tracking]
      summary: Get customer-visible unit detail
      parameters:
        - {name: trackingCode, in: path, required: true, schema: {type: string}}
        - {name: unitId, in: path, required: true, schema: {type: string, format: uuid}}
      responses: {'200': {description: Customer-safe unit detail}, '404': {$ref: '#/components/responses/NotFound'}}
  /api/public/v2/projects/{trackingCode}/execution-units/{unitId}/timeline:
    get:
      tags: [Public Project Tracking]
      summary: Get only customer-visible events in a bounded page
      parameters:
        - {name: trackingCode, in: path, required: true, schema: {type: string}}
        - {name: unitId, in: path, required: true, schema: {type: string, format: uuid}}
      responses: {'200': {description: Customer-visible timeline}, '404': {$ref: '#/components/responses/NotFound'}}
  /api/transport-methods:
    get:
      tags: [Public Shipment]
      summary: List public transport methods
      description: Public endpoint. Returns available domestic and international transport methods.
      responses:
        '200':
          description: Transport methods payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportMethodsPayload'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/shipment-request:
    post:
      tags: [Public Shipment]
      summary: Create a public shipment request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentRequestCreate'
      responses:
        '201':
          description: Shipment request created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentRequestCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/public/track/{identifier}:
    get:
      tags: [Public Tracking]
      summary: Public shipment tracking by id or tracking code
      parameters:
        - name: identifier
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Public tracking payload. Best-effort schema from public tracking contract tests.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/expert/auth/login:
    post:
      tags: [Expert Auth]
      summary: Expert/admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpertLoginRequest'
      responses:
        '200':
          description: Login success with expert data and tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpertLoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    options:
      tags: [Expert Auth]
      summary: CORS preflight for login
      responses:
        '200':
          description: Empty CORS preflight response.
  /api/expert/auth/refresh:
    post:
      tags: [Expert Auth]
      summary: Refresh expert access token
      description: Rotates the submitted refresh token. Reuse of a consumed refresh token revokes the affected logical session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: A compatible rotated access and refresh token payload.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/expert/auth/logout:
    post:
      tags: [Expert Auth]
      summary: Logout authenticated expert
      description: Revokes the current logical session, including its refresh token.
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/expert/auth/logout-all:
    post:
      tags: [Expert Auth]
      summary: Logout all sessions for the authenticated expert
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Aggregate revocation result without internal session identifiers.
          content:
            application/json:
              schema:
                type: object
                required: [message, revoked_sessions]
                properties:
                  message:
                    type: string
                  revoked_sessions:
                    type: integer
                    minimum: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/expert/requests:
    get:
      tags: [Expert Console]
      summary: List expert console shipment requests
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated request list.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/expert/requests/{request_id}:
    get:
      tags: [Expert Console]
      summary: Get expert shipment request detail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Request detail payload.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/expert/requests/{request_id}/assign:
    post:
      tags: [Expert Console]
      summary: Assign or reassign a request to an expert
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentRequest'
      responses:
        '200':
          description: Assignment response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/expert/requests/{request_id}/status:
    post:
      tags: [Expert Console]
      summary: Update expert shipment request status
      description: |
        Mutation endpoint used by the centralized `changeRequestStatus` frontend helper.
        Current behavior updates the request status, marks it unread for the assignee,
        writes an ExpertConsoleLog status_change entry, and creates a status-change
        notification when the request has an assignee.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpertStatusUpdateRequest'
            examples:
              default:
                value:
                  status: in_progress
                  note: Started
      responses:
        '200':
          description: Status update response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  message:
                    type: string
                  status:
                    type: string
              examples:
                default:
                  value:
                    message: Status updated successfully
                    status: in_progress
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/expert/requests/{request_id}/quote:
    post:
      tags: [Expert Console]
      summary: Create quote for a request
      security:
