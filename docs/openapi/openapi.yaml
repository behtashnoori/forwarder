openapi: 3.0.3
info:
  title: Forwarder Backend API
  version: 1.9.0
  description: |
    Initial OpenAPI documentation for the Forwarder backend.

    This document is based on current Flask routes, service-layer behavior, and characterization tests.
    It intentionally reflects current behavior, including imperfect or legacy response shapes.
servers:
  - url: http://localhost:5000
    description: Local backend placeholder
tags:
  - name: Operational Intelligence
  - name: Document Readiness
  - name: Operational Execution
  - name: Project Configuration
  - name: Logistics Network
  - name: Internal Cargo
  - name: Master Data
  - name: Execution Units
  - name: Public Project Tracking
  - name: Public Shipment
  - name: Public Tracking
  - name: Expert Auth
  - name: Expert Console
  - name: CRM
  - name: User Management
  - name: Admin Panel
  - name: Customer Gamification
  - name: Site Settings
components:
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        default: 20
    RequestId:
      name: request_id
      in: path
      required: true
      schema:
        type: integer
  responses:
    LogisticsTypeItem:
      description: Governed logistics point type envelope.
      content: { application/json: { schema: { type: object, required: [item], properties: { item: { $ref: '#/components/schemas/LogisticsPointType' } } } } }
    LogisticsTypeList:
      description: Governed logistics point type collection.
      content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/LogisticsPointType' } } } } } }
    LogisticsPointItem:
      description: Organization-scoped logistics point envelope.
      content: { application/json: { schema: { type: object, required: [item], properties: { item: { $ref: '#/components/schemas/LogisticsPoint' } } } } }
    LogisticsPointList:
      description: Paginated organization-scoped logistics point collection.
      content: { application/json: { schema: { type: object, required: [items, page, per_page, total, pages], properties: { items: { type: array, items: { $ref: '#/components/schemas/LogisticsPoint' } }, page: { type: integer }, per_page: { type: integer }, total: { type: integer }, pages: { type: integer } } } } }
    ProjectLogisticsPointItem:
      description: Project logistics point association envelope.
      content: { application/json: { schema: { type: object, required: [item], properties: { item: { $ref: '#/components/schemas/ProjectLogisticsPoint' } } } } }
    ProjectLogisticsPointList:
      description: Project logistics point association collection.
      content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ProjectLogisticsPoint' } } } } } }
    Message:
      description: Message payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    BadRequest:
      description: Bad request using current route-specific localized payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated user lacks required role or request access.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found using current route-specific localized payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Internal server error using current route-specific localized payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token used by protected expert, CRM, admin, and user-management endpoints.
  schemas:
    LogisticsNetworkError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: VALIDATION_FAILED }
            message: { type: string }
    LogisticsPointType:
      type: object
      required: [public_id, immutable_code, fa_name, en_name, display_order, is_active, version, updated_at]
      properties:
        public_id: { type: string, format: uuid }
        immutable_code: { type: string, maxLength: 64, readOnly: true }
        fa_name: { type: string, maxLength: 160 }
        en_name: { type: string, maxLength: 160 }
        definition: { type: string, nullable: true }
        display_order: { type: integer }
        is_active: { type: boolean }
        version: { type: integer, minimum: 1 }
        updated_at: { type: string, format: date-time }
    LogisticsPointTypeCreate:
      type: object
      required: [immutable_code, fa_name, en_name]
      properties:
        immutable_code: { type: string, maxLength: 64, description: Accepted governed type code. }
        fa_name: { type: string, maxLength: 160 }
        en_name: { type: string, maxLength: 160 }
        definition: { type: string, maxLength: 4000, nullable: true }
        display_order: { type: integer, default: 0 }
    LogisticsPointTypeUpdate:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
        fa_name: { type: string, maxLength: 160 }
        en_name: { type: string, maxLength: 160 }
        definition: { type: string, maxLength: 4000, nullable: true }
        display_order: { type: integer }
    VersionCommand:
      type: object
      required: [version]
      properties: { version: { type: integer, minimum: 1 } }
    LogisticsPoint:
      type: object
      required: [public_id, immutable_code, fa_name, is_active, version, point_type, country, updated_at]
      properties:
        public_id: { type: string, format: uuid }
        immutable_code: { type: string, maxLength: 64, readOnly: true }
        fa_name: { type: string, maxLength: 160 }
        en_name: { type: string, maxLength: 160, nullable: true }
        short_address: { type: string, maxLength: 500, nullable: true }
        is_active: { type: boolean }
        version: { type: integer, minimum: 1 }
        updated_at: { type: string, format: date-time }
        point_type: { $ref: '#/components/schemas/LogisticsPointType' }
        country: { $ref: '#/components/schemas/LogisticsGeography' }
        province: { allOf: [{ $ref: '#/components/schemas/LogisticsGeography' }], nullable: true }
        city: { allOf: [{ $ref: '#/components/schemas/LogisticsGeography' }], nullable: true }
    LogisticsGeography:
      type: object
      properties:
        code: { type: string, nullable: true }
        fa_name: { type: string }
        en_name: { type: string }
    LogisticsPointCreate:
      type: object
      required: [immutable_code, point_type_public_id, fa_name, country_code]
      properties:
        immutable_code: { type: string, maxLength: 64 }
        point_type_public_id: { type: string, format: uuid }
        fa_name: { type: string, maxLength: 160 }
        en_name: { type: string, maxLength: 160, nullable: true }
        country_code: { type: string }
        province_code: { type: string, nullable: true }
        city_code: { type: string, nullable: true, description: Requires a consistent province_code. }
        short_address: { type: string, maxLength: 500, nullable: true }
        confirm_probable_duplicate: { type: boolean, default: false, description: Explicit reviewed override for a probable, never exact, duplicate. }
    LogisticsPointUpdate:
      allOf:
        - { $ref: '#/components/schemas/VersionCommand' }
        - type: object
          properties:
            fa_name: { type: string, maxLength: 160 }
            en_name: { type: string, maxLength: 160, nullable: true }
            country_code: { type: string }
            province_code: { type: string, nullable: true }
            city_code: { type: string, nullable: true }
            short_address: { type: string, maxLength: 500, nullable: true }
    ProjectLogisticsPoint:
      type: object
      required: [public_id, project_role, sequence_number, is_active, version, logistics_point]
      properties:
        public_id: { type: string, format: uuid }
        project_role: { type: string, enum: [ORIGIN, INTERMEDIATE, DESTINATION, CUSTOMS_PROCESSING, TRANSFER, STORAGE, LOADING, UNLOADING, OTHER_GOVERNED] }
        sequence_number: { type: integer, minimum: 1 }
        display_label: { type: string, maxLength: 160, nullable: true }
        notes: { type: string, maxLength: 4000, nullable: true }
        is_active: { type: boolean }
        version: { type: integer, minimum: 1 }
        logistics_point: { $ref: '#/components/schemas/LogisticsPoint' }
    ProjectLogisticsPointCreate:
      type: object
      required: [logistics_point_public_id, project_role, sequence_number]
      properties:
        logistics_point_public_id: { type: string, format: uuid, description: Existing active point in the Project organization; free-text master creation is not accepted. }
        project_role: { type: string, enum: [ORIGIN, INTERMEDIATE, DESTINATION, CUSTOMS_PROCESSING, TRANSFER, STORAGE, LOADING, UNLOADING, OTHER_GOVERNED] }
        sequence_number: { type: integer, minimum: 1 }
        display_label: { type: string, maxLength: 160, nullable: true }
        notes: { type: string, maxLength: 4000, nullable: true }
    ProjectLogisticsPointUpdate:
      allOf:
        - { $ref: '#/components/schemas/VersionCommand' }
        - type: object
          properties:
            project_role: { type: string, enum: [ORIGIN, INTERMEDIATE, DESTINATION, CUSTOMS_PROCESSING, TRANSFER, STORAGE, LOADING, UNLOADING, OTHER_GOVERNED] }
            sequence_number: { type: integer, minimum: 1 }
            display_label: { type: string, maxLength: 160, nullable: true }
            notes: { type: string, maxLength: 4000, nullable: true }
    ProjectLogisticsReorder:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [public_id, version]
            properties:
              public_id: { type: string, format: uuid }
              version: { type: integer, minimum: 1 }
    MasterDataItem:
      type: object
      required: [public_id, immutable_code, fa_name, en_name, display_order, is_active, created_at, updated_at, version]
      properties:
        public_id: { type: string, format: uuid }
        immutable_code: { type: string, maxLength: 64 }
        fa_name: { type: string, maxLength: 160 }
        en_name: { type: string, maxLength: 160 }
        description: { type: string, nullable: true }
        parent_id: { type: string, format: uuid, nullable: true }
        symbol: { type: string, maxLength: 32 }
        measurement_dimension:
          type: string
          enum: [COUNT, WEIGHT, VOLUME, LENGTH, OTHER_GOVERNED]
        display_order: { type: integer }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    MasterDataWrite:
      type: object
      required: [immutable_code, fa_name, en_name]
      properties:
        immutable_code: { type: string, maxLength: 64 }
        fa_name: { type: string, maxLength: 160 }
        en_name: { type: string, maxLength: 160 }
        description: { type: string, nullable: true }
        display_order: { type: integer, default: 0 }
        is_active: { type: boolean, default: true }
    CargoTypeCreate:
      allOf:
        - { $ref: '#/components/schemas/MasterDataWrite' }
        - type: object
          properties:
            parent_id: { type: string, format: uuid, nullable: true }
    ServiceTypeCreate:
      allOf:
        - { $ref: '#/components/schemas/MasterDataWrite' }
    UnitOfMeasureCreate:
      allOf:
        - { $ref: '#/components/schemas/MasterDataWrite' }
        - type: object
          required: [symbol, measurement_dimension]
          properties:
            symbol: { type: string, maxLength: 32 }
            measurement_dimension: { type: string, enum: [COUNT, WEIGHT, VOLUME, LENGTH, OTHER_GOVERNED] }
    MasterDataCreate:
      oneOf:
        - { $ref: '#/components/schemas/CargoTypeCreate' }
        - { $ref: '#/components/schemas/ServiceTypeCreate' }
        - { $ref: '#/components/schemas/UnitOfMeasureCreate' }
    MasterDataUpdate:
      type: object
      required: [version]
      properties:
        immutable_code: { type: string, description: May be repeated unchanged; changes are rejected. }
        fa_name: { type: string, maxLength: 160 }
        en_name: { type: string, maxLength: 160 }
        description: { type: string, nullable: true }
        display_order: { type: integer }
        version: { type: integer, minimum: 1 }
    CargoTypeUpdate:
      allOf:
        - { $ref: '#/components/schemas/MasterDataUpdate' }
        - type: object
          properties:
            parent_id: { type: string, format: uuid, nullable: true }
    ServiceTypeUpdate:
      allOf:
        - { $ref: '#/components/schemas/MasterDataUpdate' }
    UnitOfMeasureUpdate:
      allOf:
        - { $ref: '#/components/schemas/MasterDataUpdate' }
        - type: object
          properties:
            symbol: { type: string, maxLength: 32 }
            measurement_dimension: { type: string, enum: [COUNT, WEIGHT, VOLUME, LENGTH, OTHER_GOVERNED] }
    MasterDataUpdateRequest:
      oneOf:
        - { $ref: '#/components/schemas/CargoTypeUpdate' }
        - { $ref: '#/components/schemas/ServiceTypeUpdate' }
        - { $ref: '#/components/schemas/UnitOfMeasureUpdate' }
    ErrorResponse:
      type: object
      additionalProperties: true
      properties:
        error:
          type: string
        message:
          type: string
      description: Current API uses both `error` and `message` depending on route.
    MessageResponse:
      type: object
      additionalProperties: true
      properties:
        message:
          type: string
    IdName:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
        name:
          type: string
    TransportMethodsPayload:
      type: object
      additionalProperties: true
      properties:
        domestic_methods:
          type: array
          items:
            $ref: '#/components/schemas/IdName'
        international_methods:
          type: array
          items:
            $ref: '#/components/schemas/IdName'
    ShipmentRequestCreate:
      type: object
      additionalProperties: true
      description: Best-effort public shipment form payload. Exact optional fields depend on shipment type.
      properties:
        shipping_type:
          type: string
          example: domestic
        customer_name:
          type: string
        customer_phone:
          type: string
        customer_email:
          type: string
        transport_method:
          type: string
        cargo_type:
          type: string
    ShipmentRequestCreated:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
        tracking_code:
          type: string
        status:
          type: string
        message:
          type: string
    Pagination:
      type: object
      additionalProperties: true
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        pages:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    ExpertLoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    ExpertLoginResponse:
      type: object
      additionalProperties: true
      properties:
        success:
          type: boolean
        expert:
          type: object
          additionalProperties: true
        tokens:
          type: object
          additionalProperties: true
    QuoteRequest:
      type: object
      additionalProperties: true
      properties:
        amount:
          type: number
        currency:
          type: string
          example: IRR
        note:
          type: string
        valid_until:
          type: string
          format: date
    MessageRequest:
      type: object
      additionalProperties: true
      properties:
        message:
          type: string
    AssignmentRequest:
      type: object
      additionalProperties: true
      properties:
        expert_id:
          type: integer
    ExpertStatusUpdateRequest:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
          description: Requested shipment request status.
          enum:
            - new
            - assigned
            - in_progress
            - quoted
            - waiting_for_customer
            - won
            - lost
            - closed
        note:
          type: string
          description: Optional status-change note sent by the frontend.
    UserPayload:
      type: object
      additionalProperties: true
      properties:
        username:
          type: string
        email:
          type: string
        full_name:
          type: string
        role:
          type: string
        password:
          type: string
        phone:
          type: string
        department:
          type: string
    AssignmentRulePayload:
      type: object
      additionalProperties: true
      properties:
        name:
          type: string
        priority:
          type: integer
        conditions:
          type: object
          additionalProperties: true
        assignment_strategy:
          type: string
        is_active:
          type: boolean
    ReferralRulePayload:
      type: object
      additionalProperties: true
      properties:
        name:
          type: string
        priority:
          type: integer
        conditions:
          type: object
          additionalProperties: true
        is_active:
          type: boolean
    CustomerRegistrationRequest:
      type: object
      required:
        - email
        - phone
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
          example: '09120000000'
        first_name:
          type: string
        last_name:
          type: string
    CustomerRegistrationResponse:
      type: object
      additionalProperties: true
      properties:
        message:
          type: string
        customer_id:
          type: integer
        email_sent:
          type: boolean
        is_verified:
          type: boolean
    CompleteStepRequest:
      type: object
      required:
        - customer_id
        - request_id
        - step_name
      properties:
        customer_id:
          type: integer
        request_id:
          type: integer
        step_name:
          type: string
          example: expert_assigned
    SiteSettings:
      type: object
      additionalProperties: true
    CargoAlias:
      type: object
      required: [public_id, alias_text, normalized_alias, language, alias_type, is_active]
      properties:
        public_id: { type: string, format: uuid }
        alias_text: { type: string, maxLength: 200 }
        normalized_alias: { type: string, maxLength: 200 }
        language: { type: string, enum: [fa, en, und] }
        alias_type: { type: string, enum: [COMMON_NAME, CUSTOMER_TERM, ABBREVIATION, LEGACY_TERM, OTHER_GOVERNED] }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CargoCatalogItem:
      type: object
      required: [public_id, immutable_code, fa_name, cargo_type, is_active, version]
      properties:
        public_id: { type: string, format: uuid }
        immutable_code: { type: string, maxLength: 64 }
        fa_name: { type: string, maxLength: 160 }
        en_name: { type: string, nullable: true, maxLength: 160 }
        description: { type: string, nullable: true }
        part_number: { type: string, nullable: true }
        customer_item_code: { type: string, nullable: true }
        hs_code: { type: string, nullable: true }
        brand: { type: string, nullable: true }
        model: { type: string, nullable: true }
        cargo_type: { type: object, additionalProperties: true }
        default_uom: { type: object, nullable: true, additionalProperties: true }
        aliases: { type: array, items: { $ref: '#/components/schemas/CargoAlias' } }
        is_active: { type: boolean }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ShipmentCargoItem:
      type: object
      required: [public_id, line_number, source, cargo_type_public_id, uom_public_id, quantity, display_name_snapshot, cargo_type_code_snapshot, uom_code_snapshot, uom_symbol_snapshot, version]
      properties:
        public_id: { type: string, format: uuid }
        line_number: { type: integer, minimum: 1 }
        source: { type: string, enum: [catalog, manual] }
        catalog_item_public_id: { type: string, format: uuid, nullable: true }
        cargo_type_public_id: { type: string, format: uuid }
        uom_public_id: { type: string, format: uuid }
        quantity: { type: string, pattern: '^[0-9]+(?:\.[0-9]+)?$' }
        display_name_snapshot: { type: string }
        cargo_type_code_snapshot: { type: string }
        cargo_type_fa_snapshot: { type: string }
        cargo_type_en_snapshot: { type: string }
        uom_code_snapshot: { type: string }
        uom_symbol_snapshot: { type: string }
        part_number_snapshot: { type: string, nullable: true }
        customer_item_code_snapshot: { type: string, nullable: true }
        hs_code_snapshot: { type: string, nullable: true }
        brand_snapshot: { type: string, nullable: true }
        model_snapshot: { type: string, nullable: true }
        description_snapshot: { type: string, nullable: true }
        version: { type: integer, minimum: 1 }
    ProjectConfigurationPage:
      type: object
      additionalProperties: false
      required: [page, per_page, total, pages]
      properties:
        page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        pages: { type: integer, minimum: 0 }
    ProjectConfigurationBase:
      type: object
      additionalProperties: false
      required: [public_id, is_active, version, created_at, updated_at]
      properties:
        public_id: { type: string, format: uuid }
        is_active: { type: boolean }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProjectServiceCreate:
      type: object
      additionalProperties: false
      required: [service_type_public_id]
      properties: { service_type_public_id: { type: string, format: uuid }, is_primary: { type: boolean, default: false }, is_required: { type: boolean, default: false }, display_order: { type: integer, minimum: 0, default: 0 }, display_label: { type: string, nullable: true, maxLength: 160 }, notes: { type: string, nullable: true, maxLength: 4000 } }
    ProjectServiceUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties: { version: { type: integer, minimum: 1 }, is_primary: { type: boolean }, is_required: { type: boolean }, display_order: { type: integer, minimum: 0 }, display_label: { type: string, nullable: true, maxLength: 160 }, notes: { type: string, nullable: true, maxLength: 4000 } }
    ProjectServiceResponse:
      allOf:
        - { $ref: '#/components/schemas/ProjectConfigurationBase' }
        - { type: object, additionalProperties: false, required: [service_type_public_id, is_primary, is_required, display_order], properties: { service_type_public_id: { type: string, format: uuid }, is_primary: { type: boolean }, is_required: { type: boolean }, display_order: { type: integer, minimum: 0 }, display_label: { type: string, nullable: true }, notes: { type: string, nullable: true } } }
    ProjectServiceListResponse:
      allOf: [{ $ref: '#/components/schemas/ProjectConfigurationPage' }, { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ProjectServiceResponse' } } } }]
    ProjectDocumentRequirementCreate:
      type: object
      additionalProperties: false
      required: [document_definition_public_id, requirement_level]
      properties: { document_definition_public_id: { type: string, format: uuid }, requirement_level: { type: string, enum: [REQUIRED, OPTIONAL, CONDITIONAL] }, conditional_description: { type: string, nullable: true, maxLength: 4000 }, display_order: { type: integer, minimum: 0, default: 0 }, notes: { type: string, nullable: true, maxLength: 4000 } }
    ProjectDocumentRequirementUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties: { version: { type: integer, minimum: 1 }, requirement_level: { type: string, enum: [REQUIRED, OPTIONAL, CONDITIONAL] }, conditional_description: { type: string, nullable: true, maxLength: 4000 }, display_order: { type: integer, minimum: 0 }, notes: { type: string, nullable: true, maxLength: 4000 } }
    ProjectDocumentRequirementResponse:
      allOf: [{ $ref: '#/components/schemas/ProjectConfigurationBase' }, { type: object, additionalProperties: false, required: [document_definition_public_id, document_definition_code, document_definition_title, requirement_level, display_order], properties: { document_definition_public_id: { type: string, format: uuid }, document_definition_code: { type: string }, document_definition_title: { type: string }, requirement_level: { type: string, enum: [REQUIRED, OPTIONAL, CONDITIONAL] }, conditional_description: { type: string, nullable: true }, display_order: { type: integer, minimum: 0 }, notes: { type: string, nullable: true } } }]
    ProjectDocumentRequirementListResponse:
      allOf: [{ $ref: '#/components/schemas/ProjectConfigurationPage' }, { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ProjectDocumentRequirementResponse' } } } }]
    ProjectMilestoneDefinitionCreate:
      type: object
      additionalProperties: false
      required: [milestone_type_public_id, sequence]
      properties: { milestone_type_public_id: { type: string, format: uuid }, sequence: { type: integer, minimum: 1 }, is_required: { type: boolean, default: false }, project_logistics_point_public_id: { type: string, format: uuid, nullable: true }, display_label: { type: string, nullable: true, maxLength: 160 }, target_duration_value: { type: integer, minimum: 1, nullable: true }, warning_duration_value: { type: integer, minimum: 1, nullable: true }, duration_unit: { type: string, enum: [MINUTE, HOUR, DAY], nullable: true }, notes: { type: string, nullable: true, maxLength: 4000 } }
    ProjectMilestoneDefinitionUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties: { version: { type: integer, minimum: 1 }, sequence: { type: integer, minimum: 1 }, is_required: { type: boolean }, project_logistics_point_public_id: { type: string, format: uuid, nullable: true }, display_label: { type: string, nullable: true, maxLength: 160 }, target_duration_value: { type: integer, minimum: 1, nullable: true }, warning_duration_value: { type: integer, minimum: 1, nullable: true }, duration_unit: { type: string, enum: [MINUTE, HOUR, DAY], nullable: true }, notes: { type: string, nullable: true, maxLength: 4000 } }
    ProjectMilestoneDefinitionResponse:
      allOf: [{ $ref: '#/components/schemas/ProjectConfigurationBase' }, { type: object, additionalProperties: false, required: [milestone_type_public_id, milestone_type_code, sequence, is_required], properties: { milestone_type_public_id: { type: string, format: uuid }, milestone_type_code: { type: string }, sequence: { type: integer, minimum: 1 }, is_required: { type: boolean }, project_logistics_point_public_id: { type: string, format: uuid, nullable: true }, display_label: { type: string, nullable: true }, target_duration_value: { type: integer, minimum: 1, nullable: true }, warning_duration_value: { type: integer, minimum: 1, nullable: true }, duration_unit: { type: string, enum: [MINUTE, HOUR, DAY], nullable: true }, notes: { type: string, nullable: true } } }]
    ProjectMilestoneDefinitionListResponse:
      allOf: [{ $ref: '#/components/schemas/ProjectConfigurationPage' }, { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ProjectMilestoneDefinitionResponse' } } } }]
    ServiceTypeSelectorItem:
      type: object
      additionalProperties: false
      required: [public_id, immutable_code, fa_name, en_name]
      properties: { public_id: { type: string, format: uuid }, immutable_code: { type: string }, fa_name: { type: string }, en_name: { type: string } }
    DocumentDefinitionSelectorItem:
      type: object
      additionalProperties: false
      required: [public_id, code, title]
      properties: { public_id: { type: string, format: uuid }, code: { type: string }, title: { type: string } }
    MilestoneTypeSelectorItem:
      type: object
      additionalProperties: false
      required: [public_id, immutable_code, fa_name, en_name]
      properties: { public_id: { type: string, format: uuid }, immutable_code: { type: string }, fa_name: { type: string }, en_name: { type: string } }
    ProjectLogisticsPointSelectorItem:
      type: object
      additionalProperties: false
      required: [public_id, project_role, sequence_number]
      properties: { public_id: { type: string, format: uuid }, project_role: { type: string }, sequence_number: { type: integer, minimum: 1 }, display_label: { type: string, nullable: true } }
    SelectorListResponse:
      allOf: [{ $ref: '#/components/schemas/ProjectConfigurationPage' }, { type: object, required: [items], properties: { items: { type: array, items: { oneOf: [{ $ref: '#/components/schemas/ServiceTypeSelectorItem' }, { $ref: '#/components/schemas/DocumentDefinitionSelectorItem' }, { $ref: '#/components/schemas/MilestoneTypeSelectorItem' }, { $ref: '#/components/schemas/ProjectLogisticsPointSelectorItem' }] } } } }]
    ProjectConfigurationItemEnvelope:
      type: object
      additionalProperties: false
      required: [item]
      properties: { item: { oneOf: [{ $ref: '#/components/schemas/ProjectServiceResponse' }, { $ref: '#/components/schemas/ProjectDocumentRequirementResponse' }, { $ref: '#/components/schemas/ProjectMilestoneDefinitionResponse' }] } }
    ProjectMilestoneReorderRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties: { items: { type: array, minItems: 1, items: { type: object, additionalProperties: false, required: [public_id, version], properties: { public_id: { type: string, format: uuid }, version: { type: integer, minimum: 1 } } } } }
    ProjectMilestoneReorderResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/ProjectMilestoneDefinitionResponse' } } }
    ProjectConfigurationError:
      type: object
      additionalProperties: false
      required: [error]
      properties: { error: { type: object, additionalProperties: false, required: [code, message], properties: { code: { type: string, enum: [VALIDATION_FAILED, VERSION_CONFLICT, CONFLICT, NOT_FOUND, FORBIDDEN_OPERATION, UNAUTHENTICATED] }, message: { type: string } } } }
    ProjectConfigurationValidationError:
      allOf: [{ $ref: '#/components/schemas/ProjectConfigurationError' }]
    ProjectConfigurationConflictError:
      allOf: [{ $ref: '#/components/schemas/ProjectConfigurationError' }]
    ProjectConfigurationDuplicateError:
      allOf: [{ $ref: '#/components/schemas/ProjectConfigurationError' }]
    ProjectConfigurationNotFoundError:
      allOf: [{ $ref: '#/components/schemas/ProjectConfigurationError' }]
    MilestoneTypeCreate:
      type: object
      additionalProperties: false
      required: [immutable_code, fa_name, en_name]
      properties: { immutable_code: { type: string, maxLength: 64 }, fa_name: { type: string, maxLength: 160 }, en_name: { type: string, maxLength: 160 }, definition: { type: string, nullable: true, maxLength: 4000 }, display_order: { type: integer, minimum: 0 } }
    MilestoneTypeUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties: { version: { type: integer, minimum: 1 }, fa_name: { type: string, maxLength: 160 }, en_name: { type: string, maxLength: 160 }, definition: { type: string, nullable: true, maxLength: 4000 }, display_order: { type: integer, minimum: 0 } }
    ExecutionMilestone:
      type: object
      additionalProperties: false
      required: [public_id, route_plan_public_id, sequence, milestone_type, status, verification_state, version]
      properties:
        public_id: { type: string, format: uuid }
        route_plan_public_id: { type: string, format: uuid, nullable: true }
        sequence: { type: integer, minimum: 1 }
        milestone_type: { type: string }
        milestone_type_snapshot: { type: object, nullable: true, additionalProperties: false, properties: { public_id: { type: string, format: uuid }, code: { type: string }, fa_name: { type: string }, en_name: { type: string } } }
        expected_point_snapshot: { type: object, nullable: true, additionalProperties: false, properties: { public_id: { type: string, format: uuid }, label: { type: string, nullable: true }, role: { type: string } } }
        target_metadata: { type: object, nullable: true, additionalProperties: false, properties: { target_duration_value: { type: integer, nullable: true }, warning_duration_value: { type: integer, nullable: true }, duration_unit: { type: string, nullable: true, enum: [MINUTE, HOUR, DAY] }, required: { type: boolean } } }
        status: { type: string, enum: [PENDING, READY, IN_PROGRESS, COMPLETED, SKIPPED, CANCELLED, BLOCKED] }
        prior_active_status: { type: string, nullable: true }
        planned_at: { type: string, format: date-time, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        skipped_at: { type: string, format: date-time, nullable: true }
        cancelled_at: { type: string, format: date-time, nullable: true }
        blocked_at: { type: string, format: date-time, nullable: true }
        verification_state: { type: string }
        version: { type: integer, minimum: 1 }
    ExecutionTransition:
      type: object
      additionalProperties: false
      required: [target_status, expected_version]
      properties: { target_status: { type: string, enum: [PENDING, READY, IN_PROGRESS, COMPLETED, SKIPPED, CANCELLED, BLOCKED] }, expected_version: { type: integer, minimum: 1 }, effective_at: { type: string, format: date-time }, reason: { type: string }, note: { type: string, nullable: true } }
    OperationalReason:
      type: object
      additionalProperties: false
      required: [public_id, immutable_code, fa_name, en_name, display_order, is_active, version]
      properties: { public_id: { type: string, format: uuid }, immutable_code: { type: string }, fa_name: { type: string }, en_name: { type: string }, definition: { type: string, nullable: true }, display_order: { type: integer, minimum: 0 }, is_active: { type: boolean }, version: { type: integer, minimum: 1 } }
    OperationalCondition:
      type: object
      additionalProperties: false
      required: [public_id, reason, active, duration_seconds, version]
      properties: { public_id: { type: string, format: uuid }, milestone_public_id: { type: string, format: uuid, nullable: true }, reason: { $ref: '#/components/schemas/OperationalReason' }, started_at: { type: string, format: date-time }, occurred_at: { type: string, format: date-time }, resolved_at: { type: string, format: date-time, nullable: true }, active: { type: boolean }, note: { type: string, nullable: true }, duration_seconds: { type: integer, minimum: 0 }, version: { type: integer, minimum: 1 } }
    MilestoneEvent190:
      type: object
      additionalProperties: false
      required: [public_id, milestone_public_id, event_type, effective_at, recorded_at, source_channel, verification_state]
      properties: { public_id: { type: string, format: uuid }, milestone_public_id: { type: string, format: uuid }, event_type: { type: string }, effective_at: { type: string, format: date-time }, recorded_at: { type: string, format: date-time }, source_channel: { type: string }, reason: { type: string, nullable: true }, note: { type: string, nullable: true }, verification_state: { type: string }, verified_at: { type: string, format: date-time, nullable: true }, correction_of_event_public_id: { type: string, format: uuid, nullable: true } }
    OipProjectionHealth:
      type: object
      additionalProperties: false
      required: [health_state, calculated_at, source_watermark, projection_version, policy_version, version]
      properties:
        health_state: { type: string, enum: [FRESH, STALE, REBUILDING, DEGRADED] }
        calculated_at: { type: string, format: date-time }
        source_watermark: { type: string }
        processed_watermark: { type: string, nullable: true }
        projection_version: { type: string }
        policy_version: { type: string }
        reason_code: { type: string, nullable: true, description: Stable sanitized code when non-FRESH. }
        reason: { type: string, nullable: true, description: Sanitized reason; never includes internal exception detail. }
        last_success_at: { type: string, format: date-time, nullable: true }
        rebuild_started_at: { type: string, format: date-time, nullable: true }
        rebuild_completed_at: { type: string, format: date-time, nullable: true }
        last_failure_at: { type: string, format: date-time, nullable: true }
        run_id: { type: string, format: uuid, nullable: true }
        version: { type: integer, minimum: 1 }
paths:
  /api/oip/policies:
    get:
      tags: [Operational Intelligence]
      summary: Read the seven approved Signal policies and configuration requirements
      description: Governed families expose INACTIVE_UNCONFIGURED abstention when no authoritative effective threshold exists.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Policy catalog, including governed threshold abstention metadata. }
        '401': { description: Authentication required. }
        '403': { description: The oip.read permission is required. }
  /api/oip/reconcile:
    post:
      tags: [Operational Intelligence]
      summary: Reconcile authoritative operational facts into OIP projections
      description: Returns reconciliation counts plus projection status, watermark, policy version, projection version, freshness timestamp, and any last error. Requires oip.reconcile.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Deterministic reconciliation and projection status. }
        '401': { description: Authentication required. }
        '403': { description: The oip.reconcile permission is required. }
        '503': { description: Reconciliation failed; projection health is DEGRADED and operational truth is unaffected. }
  /api/oip/projection/status:
    get:
      tags: [Operational Intelligence]
      summary: Read and refresh OIP projection health
      description: Applies the governed exact-watermark freshness policy. This describes derived intelligence, never operational status or readiness.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current projection health.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/OipProjectionHealth' } }
        '401': { description: Authentication required. }
        '403': { description: The oip.read permission is required. }
  /api/oip/projection/rebuild:
    post:
      tags: [Operational Intelligence]
      summary: Rebuild the disposable OIP attention projection
      description: Exposes REBUILDING for the real governed operation, then FRESH on success or DEGRADED with sanitized failure evidence.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Successful rebuild and FRESH health. }
        '401': { description: Authentication required. }
        '403': { description: The oip.reconcile permission is required. }
        '503': { description: Rebuild failed and health is DEGRADED. }
  /api/oip/attention:
    get:
      tags: [Operational Intelligence]
      summary: Read the tenant attention queue
      description: Returns eligible OPEN, ACKNOWLEDGED, IN_PROGRESS, and expired-SNOOZED Situations with DecisionContext ranking explanation and freshness/projection status.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Ranked attention projections containing opaque public IDs only. }
        '401': { description: Authentication required. }
        '403': { description: The oip.read permission is required. }
  /api/oip/situations/{public_id}:
    parameters:
      - { name: public_id, in: path, required: true, description: Opaque Situation public ID., schema: { type: string, format: uuid } }
    get:
      tags: [Operational Intelligence]
      summary: Read Situation detail, Recommendation, evidence, history, and freshness
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Situation detail with advisory Recommendation and no automatic execution. }
        '401': { description: Authentication required. }
        '403': { description: The oip.read permission is required. }
        '404': { description: Not found, including cross-tenant opaque lookup. }
  /api/oip/situations/{public_id}/decision-context:
    parameters:
      - { name: public_id, in: path, required: true, description: Opaque Situation public ID., schema: { type: string, format: uuid } }
    get:
      tags: [Operational Intelligence]
      summary: Read the current read-only DecisionContext
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: DecisionContext with blockers, missing information, permissions, and versions. }
        '401': { description: Authentication required. }
        '403': { description: The oip.read permission is required. }
        '404': { description: Situation not found. }
  /api/oip/situations/{public_id}/{action}:
    parameters:
      - { name: public_id, in: path, required: true, description: Opaque Situation public ID., schema: { type: string, format: uuid } }
      - { name: action, in: path, required: true, schema: { type: string, enum: [acknowledge, claim, start, snooze, resolve, dismiss, assign, reassign] } }
    post:
      tags: [Operational Intelligence]
      summary: Apply an optimistic Situation lifecycle transition
      description: Lifecycle values are OPEN, ACKNOWLEDGED, IN_PROGRESS, SNOOZED, RESOLVED, DISMISSED, and EXPIRED. assign/reassign deliberately return ACTION_GAP until an opaque member identity contract exists.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version]
              properties:
                expected_version: { type: integer, minimum: 1, description: Current Situation version; stale writers fail with 409. }
                reason: { type: string, minLength: 1, maxLength: 1000, description: Required for snooze, resolve, and dismiss. }
                until: { type: string, format: date-time, description: Required future instant for snooze. }
      responses:
        '200': { description: Updated Situation projection. }
        '401': { description: Authentication required. }
        '403': { description: The oip.manage permission is required. }
        '404': { description: Situation not found. }
        '409': { description: VERSION_CONFLICT for stale expected_version or INVALID_TRANSITION. }
        '422': { description: Missing reason, missing/invalid snooze time, or unsupported action. }
        '501': { description: ACTION_GAP for assign/reassign; no numeric member identity is accepted. }
  /api/v2/projects/{projectId}/execution-units:
    get:
      tags: [Execution Units]
      summary: List Project execution units without timelines
      security: [{bearerAuth: []}]
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
        - {name: search, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
        - {name: delayed, in: query, schema: {type: boolean}}
        - {name: stale, in: query, schema: {type: boolean}}
        - {name: active, in: query, schema: {type: boolean}}
      responses: {'200': {description: Bounded unit page}, '404': {$ref: '#/components/responses/NotFound'}}
    post:
      tags: [Execution Units]
      summary: Create an ExecutionUnit with a generated immutable Project-local code
      security: [{bearerAuth: []}]
      parameters: [{name: projectId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'201': {description: Unit created}, '404': {$ref: '#/components/responses/NotFound'}}
  /api/v2/projects/{projectId}/execution-units/{unitId}:
    get:
      tags: [Execution Units]
      summary: Get scoped unit detail
      security: [{bearerAuth: []}]
      parameters: &unitPath
        - {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: unitId, in: path, required: true, schema: {type: string, format: uuid}}
      responses: {'200': {description: Unit detail}, '404': {$ref: '#/components/responses/NotFound'}}
    patch:
      tags: [Execution Units]
      summary: Update permitted metadata using expected_version
      security: [{bearerAuth: []}]
      parameters: *unitPath
      responses: {'200': {description: Unit updated}, '409': {description: Version conflict}}
  /api/v2/projects/{projectId}/execution-units/{unitId}/timeline:
    get:
      tags: [Execution Units]
      summary: Get paginated internal unit timeline
      security: [{bearerAuth: []}]
      parameters: *unitPath
      responses: {'200': {description: Bounded timeline page}}
  /api/v2/projects/{projectId}/execution-units/{unitId}/events:
    post:
      tags: [Execution Units]
      summary: Append an idempotent unit event/update
      security: [{bearerAuth: []}]
      parameters: *unitPath
      responses: {'201': {description: Event appended}, '409': {description: Version or idempotency conflict}}
  /api/public/v2/projects/{trackingCode}/summary:
    get:
      tags: [Public Project Tracking]
      summary: Get aggregate project summary by opaque tracking code
      parameters: [{name: trackingCode, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Customer-safe aggregate summary}, '404': {$ref: '#/components/responses/NotFound'}}
  /api/public/v2/projects/{trackingCode}/execution-units:
    get:
      tags: [Public Project Tracking]
      summary: List customer-visible unit projections
      parameters: [{name: trackingCode, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Bounded customer-safe unit page}}
  /api/public/v2/projects/{trackingCode}/execution-units/{unitId}:
    get:
      tags: [Public Project Tracking]
      summary: Get customer-visible unit detail
      parameters:
        - {name: trackingCode, in: path, required: true, schema: {type: string}}
        - {name: unitId, in: path, required: true, schema: {type: string, format: uuid}}
      responses: {'200': {description: Customer-safe unit detail}, '404': {$ref: '#/components/responses/NotFound'}}
  /api/public/v2/projects/{trackingCode}/execution-units/{unitId}/timeline:
    get:
      tags: [Public Project Tracking]
      summary: Get only customer-visible events in a bounded page
      parameters:
        - {name: trackingCode, in: path, required: true, schema: {type: string}}
        - {name: unitId, in: path, required: true, schema: {type: string, format: uuid}}
      responses: {'200': {description: Customer-visible timeline}, '404': {$ref: '#/components/responses/NotFound'}}
  /api/transport-methods:
    get:
      tags: [Public Shipment]
      summary: List public transport methods
      description: Public endpoint. Returns available domestic and international transport methods.
      responses:
        '200':
          description: Transport methods payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportMethodsPayload'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/shipment-request:
    post:
      tags: [Public Shipment]
      summary: Create a public shipment request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentRequestCreate'
      responses:
        '201':
          description: Shipment request created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentRequestCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/public/track/{identifier}:
    get:
      tags: [Public Tracking]
      summary: Public shipment tracking by id or tracking code
      parameters:
        - name: identifier
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Public tracking payload. Best-effort schema from public tracking contract tests.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/expert/auth/login:
    post:
      tags: [Expert Auth]
      summary: Expert/admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpertLoginRequest'
      responses:
        '200':
          description: Login success with expert data and tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpertLoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    options:
      tags: [Expert Auth]
      summary: CORS preflight for login
      responses:
        '200':
          description: Empty CORS preflight response.
  /api/expert/auth/refresh:
    post:
      tags: [Expert Auth]
      summary: Refresh expert access token
      description: Rotates the submitted refresh token. Reuse of a consumed refresh token revokes the affected logical session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: A compatible rotated access and refresh token payload.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/expert/auth/logout:
    post:
      tags: [Expert Auth]
      summary: Logout authenticated expert
      description: Revokes the current logical session, including its refresh token.
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/expert/auth/logout-all:
    post:
      tags: [Expert Auth]
      summary: Logout all sessions for the authenticated expert
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Aggregate revocation result without internal session identifiers.
          content:
            application/json:
              schema:
                type: object
                required: [message, revoked_sessions]
                properties:
                  message:
                    type: string
                  revoked_sessions:
                    type: integer
                    minimum: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/expert/requests:
    get:
      tags: [Expert Console]
      summary: List expert console shipment requests
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated request list.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /api/expert/requests/{request_id}:
    get:
      tags: [Expert Console]
      summary: Get expert shipment request detail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
