version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - backend/.env.production
    ports:
      - "80:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./instance/logs:/app/instance/logs
    networks:
      - forwarder-network

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: forwarder_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forwarder_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - forwarder-network

  adminer:
    image: adminer:4
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - forwarder-network

volumes:
  pgdata:

networks:
  forwarder-network:
    driver: bridge
